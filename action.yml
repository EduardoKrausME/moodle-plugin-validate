name: Moodle Plugin Validate
description: Validate Moodle plugin structure, subplugins, metadata, language strings, Privacy API references, and selected code-quality checks without installing Moodle.
author: Eduardo Kraus

inputs:
  plugin:
    description: Path to the Moodle plugin root.
    required: false
    default: .
  language:
    description: Base language to validate.
    required: false
    default: en
  allow-empty:
    description: Allow required language strings to have an empty value.
    required: false
    default: 'false'
  ignore:
    description: 'Comma-separated validation checks to ignore. Example: table-prefix.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validate Moodle plugin
      shell: bash
      run: |
        args=("${{ inputs.plugin }}" "--lang=${{ inputs.language }}" "--format=github")
        if [ "${{ inputs.allow-empty }}" = "true" ]; then
          args+=("--allow-empty")
        fi
        if [ -n "${{ inputs.ignore }}" ]; then
          args+=("--ignore=${{ inputs.ignore }}")
        fi
        php "${{ github.action_path }}/bin/moodle-string-validate" "${args[@]}"

branding:
  icon: check-circle
  color: blue
