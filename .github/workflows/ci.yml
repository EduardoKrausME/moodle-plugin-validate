name: CI - PHP tests and finishing pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / validator and runner
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout validator
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, simplexml, xml
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find src tests -type f -name '*.php' -print0)
          php -l autoload.php

      - name: Run PHP tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*_test.php tests/run.php; do
            echo "::group::$test"
            php "$test"
            echo "::endgroup::"
          done

      - name: Check Python syntax
        run: python3 -m compileall -q .chatgpt

      - name: Exercise complete finishing pipeline
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/local_ci_fixture"
          mkdir -p "$fixture/lang/en"
          cat > "$fixture/version.php" <<'PHP'
          <?php
          defined('MOODLE_INTERNAL') || die();
          $plugin->component = 'local_ci_fixture';
          $plugin->release = '1.0.0';
          $plugin->version = 2026101400;
          $plugin->requires = 2022041900;
          PHP
          cat > "$fixture/lang/en/local_ci_fixture.php" <<'PHP'
          <?php
          $string['pluginname'] = 'CI fixture';
          PHP
          printf '# CI fixture\n' > "$fixture/README.md"
          printf 'GPL-3.0-or-later\n' > "$fixture/LICENSE"
          python3 .chatgpt/run.py "$fixture"
          python3 .chatgpt/run.py --check "$fixture"
